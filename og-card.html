<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
.card{position:relative;width:1200px;height:630px;font-family:"IBM Plex Sans",sans-serif;color:#fff;isolation:isolate;display:flex;flex-direction:column;justify-content:flex-end}
.bg{position:absolute;inset:0;z-index:-2;background:#1b1f25 url("hero/hero-07.webp") center 40%/cover no-repeat}
.veil{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(15,17,21,.30) 0%,rgba(15,17,21,.05) 38%,rgba(15,17,21,.55) 70%,rgba(15,17,21,.93) 100%)}
.top{position:absolute;top:44px;left:56px;display:flex;align-items:center;gap:13px;font-weight:600;font-size:21px;letter-spacing:.01em}
.dot{width:16px;height:16px;border-radius:50%;background:#d8362a;box-shadow:0 0 0 5px rgba(216,54,42,.30)}
.body{padding:0 56px 52px}
.kicker{display:inline-block;background:#d8362a;font-weight:600;font-size:18px;letter-spacing:.14em;text-transform:uppercase;padding:8px 16px;border-radius:2px;margin-bottom:22px}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:76px;line-height:.96;letter-spacing:-.02em;text-shadow:0 2px 26px rgba(0,0,0,.4);max-width:18ch}
h1 em{font-style:normal;color:#ffd9d4;text-decoration:underline;text-decoration-color:#d8362a;text-underline-offset:8px;text-decoration-thickness:6px}
.sub{margin-top:20px;font-size:27px;font-weight:500;color:#f1ece2;max-width:34ch;line-height:1.32}
.sub b{color:#fff;font-weight:600}
.footrow{margin-top:30px;display:flex;align-items:center;gap:18px;font-size:22px;font-weight:600}
.pill{background:#fff;color:#15171b;padding:11px 22px;border-radius:3px}
.dom{opacity:.92;letter-spacing:.02em}
</style>
</head>
<body>
<div class="card">
  <div class="bg"></div>
  <div class="veil"></div>
  <div class="top"><span class="dot"></span><span>Inicjatywa obywatelska · Jeżyce ↔ Sołacz</span></div>
  <div class="body">
    <span class="kicker">Przejście pod torami · ul. św. Wawrzyńca</span>
    <h1>Połączmy Jeżyce z <em>Sołaczem</em></h1>
    <p class="sub">Przejście pieszo-rowerowe pod torami. <b>W planie miasta od 2024 — wciąż go nie ma.</b></p>
    <div class="footrow"><span class="pill">Poprzyj — to 30 sekund</span><span class="dom">jezyce-solacz.pl</span></div>
  </div>
</div>
</body>
</html>
