<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Głosy mieszkańców · Jeżyce ↔ Sołacz</title>
<!--
  "Ściana głosów" — wszystkie 30 cytatów widoczne naraz jako mozaika (dowód społeczny),
  jeden cyklicznie wychodzi na pierwszy plan jako duży, czytelny panel.
  Kafelek wyróżnionego cytatu gaśnie w ścianie ("wyjęty do przodu").
  Scena stała 1920×1080, autoplay w pętli, sterowanie klawiaturą.
  Zero zależności zewnętrznych — działa offline przez file:// w Chrome.
  Paleta kampanii: granat "signal-deep" + papier + sygnałowa czerwień.
-->
<style>
  :root{
    --bg-0:#0c1626;        /* najgłębszy granat (winieta) */
    --bg-1:#12233a;        /* tło sceny */
    --bg-2:#163050;        /* jaśniejszy gradient */
    --paper:#f7f1e3;       /* jasny papierowy tekst */
    --paper-dim:#d8cfba;   /* przygaszony papier */
    --signal:#ff6b5e;      /* sygnałowa czerwień (akcent) */
    --signal-deep:#d8362a; /* głębsza czerwień akcentu */
    --muted:rgba(247,241,227,.55);
    --line:rgba(247,241,227,.14);
    --serif:Georgia,"Times New Roman","Iowan Old Style",serif;
    --grotesk:"Helvetica Neue",Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  }

  *{margin:0;padding:0;box-sizing:border-box}

  html,body{
    width:100%;height:100%;
    background:#000;            /* margines wokół sceny = czerń (czyste nagranie) */
    overflow:hidden;
    font-family:var(--grotesk);
    color:var(--paper);
    cursor:default;
  }
  body{display:flex;align-items:center;justify-content:center}
  body.fs{cursor:none}          /* w pełnym ekranie chowamy kursor */

  /* ===== STAŁA SCENA 1920×1080 ===== */
  .stage{
    position:relative;
    width:1920px;height:1080px;
    flex:0 0 auto;
    overflow:hidden;
    background:
      radial-gradient(120% 120% at 50% 30%, var(--bg-2) 0%, var(--bg-1) 46%, var(--bg-0) 100%);
    isolation:isolate;
  }
  /* delikatne ziarno (CSS, nisko) — przełamuje płaski gradient */
  .stage .grain{
    position:absolute;inset:0;z-index:8;pointer-events:none;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode:overlay;
  }
  /* winieta — przyciemnione rogi */
  .stage .vignette{
    position:absolute;inset:0;z-index:7;pointer-events:none;
    background:radial-gradient(120% 95% at 50% 48%, rgba(0,0,0,0) 50%, rgba(0,0,0,.5) 100%);
  }

  /* ===== ŚCIANA GŁOSÓW (mozaika w tle) ===== */
  .wall{position:absolute;inset:0;z-index:2;overflow:hidden}
  .wall-grid{
    position:absolute;inset:-5% -2%;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    grid-template-rows:repeat(6,1fr);
    gap:20px 26px;
    animation:drift 60s ease-in-out infinite alternate;
    filter:saturate(.85);
  }
  @keyframes drift{from{transform:translateY(0)}to{transform:translateY(-30px)}}

  .chip{
    position:relative;
    display:flex;flex-direction:column;justify-content:center;
    padding:14px 18px;
    border-left:2px solid rgba(255,107,94,.22);
    background:linear-gradient(180deg, rgba(247,241,227,.045), rgba(247,241,227,.02));
    border-radius:8px;
    opacity:1;
    transition:opacity .8s cubic-bezier(.22,.61,.36,1), transform .8s cubic-bezier(.22,.61,.36,1), filter .8s;
  }
  .chip .ct{
    font-family:var(--serif);
    font-size:17.5px;line-height:1.34;
    color:rgba(216,207,186,.46);
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .chip .cb{
    margin-top:9px;
    font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
    color:rgba(255,107,94,.42);
  }
  /* kafelek "wyjęty do przodu" — gaśnie, bo jego cytat jest teraz na pierwszym planie */
  .chip.lifted{opacity:0;transform:scale(.94);filter:blur(2px)}

  /* scrim centralny — przyciemnia środek ściany, żeby panel był czytelny (TV) */
  .wall .scrim{
    position:absolute;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(58% 56% at 50% 50%,
      rgba(12,22,38,.94) 0%, rgba(12,22,38,.78) 38%, rgba(12,22,38,.30) 66%, rgba(12,22,38,0) 82%);
  }
  /* maskowanie góry/dołu pod nagłówek i stopkę */
  .wall .fademask{
    position:absolute;inset:0;z-index:4;pointer-events:none;
    background:linear-gradient(180deg, var(--bg-0) 0%, rgba(12,22,38,0) 13%,
      rgba(12,22,38,0) 85%, var(--bg-0) 100%);
  }

  /* ===== TV-SAFE OBSZAR (wewnętrzne ~90%) ===== */
  .safe{
    position:absolute;inset:5% 5%;z-index:6;
    display:flex;flex-direction:column;
    pointer-events:none;
  }

  /* ===== GÓRNY NAGŁÓWEK ===== */
  .topbar{
    flex:0 0 auto;
    display:flex;align-items:center;gap:18px;
    font-size:24px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);
  }
  .topbar .dot{
    width:11px;height:11px;border-radius:50%;background:var(--signal);
    box-shadow:0 0 16px 2px rgba(255,107,94,.55);flex:0 0 auto;
    animation:pulse 3.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .topbar b{color:var(--paper-dim);font-weight:700}

  /* ===== PANEL CYTATU NA PIERWSZYM PLANIE ===== */
  .quotewrap{flex:1 1 auto;position:relative;display:flex;align-items:center;justify-content:center}
  .card{
    position:absolute;
    width:min(1080px,86%);
    padding:62px 70px 56px;
    text-align:center;
    background:linear-gradient(180deg, rgba(20,38,62,.93), rgba(12,22,38,.95));
    border:1px solid rgba(255,107,94,.30);
    border-radius:20px;
    box-shadow:
      0 50px 130px -20px rgba(0,0,0,.72),
      0 0 0 1px rgba(247,241,227,.05) inset,
      0 0 90px -30px rgba(255,107,94,.35);
    backdrop-filter:blur(3px);
    opacity:0;
    transform:translateY(24px) scale(.985);
    transition:opacity .85s cubic-bezier(.22,.61,.36,1), transform .85s cubic-bezier(.22,.61,.36,1);
    will-change:opacity,transform;
  }
  .card.in{opacity:1;transform:translateY(0) scale(1)}
  .card.in.hold{transform:translateY(0) scale(1.012);transition:transform 5s linear, opacity .85s ease}
  .card.out{opacity:0;transform:translateY(-20px) scale(.99);transition:opacity .65s ease, transform .65s ease}

  .mark{
    font-family:var(--serif);font-weight:700;color:var(--signal);
    font-size:120px;line-height:.3;height:54px;user-select:none;
    text-shadow:0 0 40px rgba(255,107,94,.3);
  }
  .q{
    font-family:var(--serif);font-weight:400;color:var(--paper);
    margin:6px auto 0;max-width:18em;text-wrap:balance;
  }
  .card.len-s  .q{font-size:clamp(2.2rem,3.0vw,3.1rem);line-height:1.18}
  .card.len-m  .q{font-size:clamp(1.9rem,2.6vw,2.7rem);line-height:1.24}
  .card.len-l  .q{font-size:clamp(1.6rem,2.2vw,2.3rem);line-height:1.30}
  .card.len-xl .q{font-size:clamp(1.4rem,1.9vw,2.0rem);line-height:1.34}

  .by{
    display:inline-flex;align-items:center;gap:16px;margin-top:38px;
    font-family:var(--grotesk);font-weight:700;font-size:26px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--signal);
  }
  .by .uline{display:inline-block;height:3px;width:0;background:var(--signal);border-radius:2px;
    transition:width .8s cubic-bezier(.22,.61,.36,1) .35s}
  .card.in .by .uline{width:52px}

  /* ===== DOLNA STOPKA + PROGRES ===== */
  .botbar{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;color:var(--muted)}
  .stats{font-size:23px;font-weight:600;letter-spacing:.04em;display:flex;align-items:center;gap:16px}
  .stats .sep{opacity:.4}
  .stats b{color:var(--paper-dim);font-weight:700}
  .stats .dom span{color:var(--signal)}
  .counter{font-family:var(--serif);font-size:30px;font-weight:700;letter-spacing:.02em;
    color:var(--paper-dim);font-variant-numeric:tabular-nums}
  .counter .tot{color:var(--muted);font-size:24px}

  .progress{position:absolute;left:0;bottom:0;z-index:9;height:4px;width:0;
    background:linear-gradient(90deg,var(--signal-deep),var(--signal));
    box-shadow:0 0 12px rgba(255,107,94,.5)}

  /* ===== INFO O STEROWANIU (znika po 3 s) ===== */
  .hint{
    position:absolute;z-index:20;left:50%;bottom:7%;transform:translateX(-50%);
    background:rgba(8,16,28,.72);border:1px solid var(--line);border-radius:999px;
    padding:12px 26px;font-size:18px;letter-spacing:.04em;color:var(--paper-dim);
    backdrop-filter:blur(6px);opacity:0;animation:hintfade 3.2s ease forwards;
  }
  .hint kbd{font-family:var(--grotesk);font-weight:700;color:var(--paper);
    background:rgba(247,241,227,.12);border:1px solid var(--line);border-radius:6px;
    padding:2px 8px;margin:0 2px;font-size:15px}
  @keyframes hintfade{0%{opacity:0}10%{opacity:1}78%{opacity:1}100%{opacity:0;visibility:hidden}}

  /* ===== PAUZA ===== */
  .paused-badge{position:absolute;z-index:20;top:5%;right:5%;display:none;align-items:center;gap:10px;
    font-size:20px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--signal)}
  body.is-paused .paused-badge{display:flex}
  .paused-badge .ico{width:12px;height:16px;position:relative;display:inline-block}
  .paused-badge .ico::before,.paused-badge .ico::after{content:"";position:absolute;top:0;width:4px;height:16px;background:var(--signal);border-radius:1px}
  .paused-badge .ico::before{left:0}.paused-badge .ico::after{right:0}

  /* ===== reduced-motion: bez ruchu, autoplay zostaje ===== */
  @media (prefers-reduced-motion:reduce){
    .wall-grid{animation:none}
    .topbar .dot{animation:none}
    .card{transition:opacity .5s ease}
    .card,.card.in,.card.in.hold,.card.out{transform:none!important}
    .by .uline{transition:none}.card.in .by .uline{width:52px}
  }
</style>
</head>
<body>
  <div class="stage" id="stage">

    <!-- ściana głosów (mozaika) -->
    <div class="wall">
      <div class="wall-grid" id="wallGrid"></div>
      <div class="scrim"></div>
      <div class="fademask"></div>
    </div>

    <div class="safe">
      <header class="topbar">
        <span class="dot"></span>
        <span>Głosy mieszkańców · <b>Jeżyce&nbsp;↔&nbsp;Sołacz</b></span>
      </header>

      <div class="quotewrap" id="quotewrap" aria-live="polite"></div>

      <footer class="botbar">
        <div class="stats">
          <span><b>510</b> podpisów</span>
          <span class="sep">·</span>
          <span><b>252</b> komentarze</span>
          <span class="sep">·</span>
          <span class="dom">jezyce-solacz<span>.</span>pl</span>
        </div>
        <div class="counter"><span id="cnum">01</span> <span class="tot">/ 30</span></div>
      </footer>
    </div>

    <div class="vignette"></div>
    <div class="grain"></div>
    <div class="paused-badge"><span class="ico"></span>Pauza</div>
    <div class="progress" id="progress"></div>
  </div>

  <div class="hint" id="hint">
    <kbd>Spacja</kbd> pauza &nbsp;·&nbsp; <kbd>←</kbd><kbd>→</kbd> nawigacja &nbsp;·&nbsp; <kbd>F</kbd> pełny ekran
  </div>

<script>
"use strict";

/* ====== TREŚĆ: 30 cytatów (anonimowe, podpis tylko dzielnicą) ====== */
const QUOTES = [
  {t:"Jak coś jest do wszystkiego, to jest do niczego.", by:"Jeżyce"},
  {t:"Bo codziennie przeżywam agonię.", by:"Jeżyce"},
  {t:"Nienawidzę tego tunelu na Kościelnej.", by:"Jeżyce"},
  {t:"Dwa wózki się nie miną, ludzie się blokują, przeciskają i przepychają.", by:"Jeżyce"},
  {t:"Tam dwie osoby nie mogą się normalnie minąć, a rower musi poczekać.", by:"Jeżyce"},
  {t:"Mam dziecko i z wózkiem to jest katorga.", by:"Jeżyce"},
  {t:"Czy ktoś z urzędu miasta doświadczył przejścia wiaduktem na Kościelnej w ładne popołudnie? Tam jest tłok, rowery się pchają, z wózkiem trzeba się zatrzymać, bo nikt się nie zmieści.", by:"Poznań"},
  {t:"Wiadukt kolejowy jest jedyną bramą z Jeżyc na Sołacz — i jednocześnie wąskim gardłem, gdzie nawet pieszym trudno się minąć.", by:"Jeżyce"},
  {t:"Zabiegam o to przejście od lat. Wnioskowaliśmy o jego wpisanie do planu. Jestem zachwycony tą inicjatywą!", by:"Jeżyce"},
  {t:"Moją pracę i mieszkanie dzielą właśnie te tory.", by:"Sołacz"},
  {t:"To absurd, żeby dzieci jeździły rowerkami z Jeżyc do Parku Sołackiego wzdłuż Niestachowskiej.", by:"Jeżyce"},
  {t:"Każde przejście do parku z dzieckiem wiąże się ze staniem w kolejce pod wiaduktem.", by:"Jeżyce"},
  {t:"Bo zależy mi, żeby łączyć, a nie dzielić!", by:"Jeżyce"},
  {t:"Przejście przy Kościelnej jest kompletnie nieprzepustowe i momentami wręcz niebezpieczne — widziałam tam już niefortunne upadki.", by:"Jeżyce"},
  {t:"Zmodernizowali całą okolicę, a obecny wiadukt to ciasna ruina, w której trzeba się przeciskać przez tłum ludzi z rowerami.", by:"Jeżyce"},
  {t:"Zależy mi na bezpiecznej drodze na Sołacz, gdzie spędzamy z synkiem co drugie popołudnie.", by:"Jeżyce"},
  {t:"Moje dzieci często przechodzą pod wiaduktem do piekarni czy na lody. Chciałabym, żeby mogły tam przechodzić bezpiecznie.", by:"Sołacz"},
  {t:"Mam starszego psa, dla którego nadkładanie drogi robi różnicę między spacerem wzdłuż ulicy a spacerem po parku.", by:"Jeżyce"},
  {t:"Nie rozumiem, czemu to przejście jest tak tragicznie rozwiązane od tylu lat.", by:"Jeżyce"},
  {t:"Obecne przejście jest beznadziejne i niebezpieczne. Widziałam, jak dziecko prawie wybiegło pod samochód.", by:"Jeżyce"},
  {t:"Prawie codziennie chodzę na spacery do Parku Sołackiego. W sezonie wiosenno-letnim tworzą się tu kolejki.", by:"Jeżyce"},
  {t:"Bo potrzebne jest normalne przejście, które ponownie połączy sztucznie rozdzielone dzielnice.", by:"Jeżyce"},
  {t:"Tracę czas na dojście z dzieckiem dookoła.", by:"Jeżyce"},
  {t:"Chodzę na Sołacz około pięć razy w tygodniu. Obecne przejście przez Kościelną jest ciasne i niefunkcjonalne.", by:"Jeżyce"},
  {t:"Przejście na Kościelnej zmusza do kilkukrotnego przechodzenia przez ulice.", by:"Jeżyce"},
  {t:"Często trzeba czekać i przepuszczać osoby z naprzeciwka — mało miejsca, a dużo ludzi.", by:"Jeżyce"},
  {t:"Jeżdżę rowerem, a obecny wąski przejazd współdzielony z samochodami jest niebezpieczny i czasochłonny.", by:"Jeżyce"},
  {t:"Chcę, żeby miasto wywiązywało się ze swoich obietnic.", by:"Inna dzielnica Poznania"},
  {t:"Mam dwójkę małych dzieci — obecne przejście jest poniżej wszelkiej krytyki, a okolica zasługuje na poprawę.", by:"Jeżyce"},
  {t:"Choreografia, którą trzeba wykonać, bywa absurdalna. Przejście jest klaustrofobiczne — ciężko wyminąć kogoś z wózkiem.", by:"Inna dzielnica Poznania"},
];

/* ====== TAKTOWANIE (deterministyczne, ms) ====== */
const IN_MS  = 850;
const OUT_MS = 650;
const HOLD_BASE = 4500;
const HOLD_PER_CHAR = 28;
const HOLD_MIN = 4500;
const HOLD_MAX = 8500;

function holdFor(text){
  const h = HOLD_BASE + text.length * HOLD_PER_CHAR;
  return Math.max(HOLD_MIN, Math.min(HOLD_MAX, h));
}

/* klasa rozmiaru wg długości tekstu */
function lenClass(text){
  const n = text.length;
  if(n <= 45)  return "len-s";
  if(n <= 95)  return "len-m";
  if(n <= 165) return "len-l";
  return "len-xl";
}

/* ====== STAN ====== */
const wrap = document.getElementById("quotewrap");
const wallGrid = document.getElementById("wallGrid");
const progressEl = document.getElementById("progress");
const cnumEl = document.getElementById("cnum");
const total = QUOTES.length;

let idx = 0;
let paused = false;
let currentCard = null;
const timers = [];

function clearTimers(){ while(timers.length) clearTimeout(timers.pop()); }
function later(fn, ms){ const id = setTimeout(fn, ms); timers.push(id); return id; }
function pad2(n){ return String(n).padStart(2,"0"); }

/* ====== ŚCIANA: zbuduj kafelki ze wszystkich cytatów ====== */
const chips = QUOTES.map((q)=>{
  const chip = document.createElement("div");
  chip.className = "chip";
  const ct = document.createElement("div");
  ct.className = "ct";
  ct.textContent = "„" + q.t + "”";
  const cb = document.createElement("div");
  cb.className = "cb";
  cb.textContent = q.by;
  chip.appendChild(ct);
  chip.appendChild(cb);
  wallGrid.appendChild(chip);
  return chip;
});
function liftChip(i){
  for(let k=0;k<chips.length;k++) chips[k].classList.toggle("lifted", k===i);
}

/* ====== PANEL: buduje kartę cytatu na pierwszym planie ====== */
function buildCard(q){
  const card = document.createElement("div");
  card.className = "card " + lenClass(q.t);

  const mark = document.createElement("div");
  mark.className = "mark";
  mark.textContent = "„";

  const bq = document.createElement("blockquote");
  bq.className = "q";
  bq.textContent = "„" + q.t + "”";

  const by = document.createElement("div");
  by.className = "by";
  const uline = document.createElement("span");
  uline.className = "uline";
  const byTxt = document.createElement("span");
  byTxt.textContent = q.by;
  by.appendChild(uline);
  by.appendChild(byTxt);

  card.appendChild(mark);
  card.appendChild(bq);
  card.appendChild(by);
  return card;
}

/* pasek progresu */
function runProgress(durationMs){
  progressEl.style.transition = "none";
  progressEl.style.width = "0%";
  void progressEl.offsetWidth;
  progressEl.style.transition = "width " + durationMs + "ms linear";
  progressEl.style.width = "100%";
}
function pauseProgress(){
  const w = getComputedStyle(progressEl).width;
  progressEl.style.transition = "none";
  progressEl.style.width = w;
}

/* pokaż cytat o indeksie i */
function show(i){
  clearTimers();
  idx = ((i % total) + total) % total;
  const q = QUOTES[idx];
  cnumEl.textContent = pad2(idx + 1);
  liftChip(idx);

  if(currentCard){ currentCard.remove(); currentCard = null; }

  const card = buildCard(q);
  wrap.appendChild(card);
  currentCard = card;

  const hold = holdFor(q.t);
  const slot = IN_MS + hold + OUT_MS;

  void card.offsetWidth;
  card.classList.add("in");
  if(!paused) runProgress(slot);

  later(()=>{ card.classList.add("hold"); }, IN_MS);

  if(paused){ pauseProgress(); return; }

  later(()=>{
    card.classList.remove("in","hold");
    card.classList.add("out");
  }, IN_MS + hold);

  later(()=>{ show(idx + 1); }, slot);
}

/* ====== STEROWANIE ====== */
function togglePause(){
  paused = !paused;
  document.body.classList.toggle("is-paused", paused);
  if(paused){
    clearTimers();
    pauseProgress();
    if(currentCard){ currentCard.classList.remove("out"); currentCard.classList.add("in","hold"); }
  } else {
    show(idx);
  }
}
function next(){ paused = false; document.body.classList.remove("is-paused"); show(idx + 1); }
function prev(){ paused = false; document.body.classList.remove("is-paused"); show(idx - 1); }

function toggleFullscreen(){
  const el = document.documentElement;
  if(!document.fullscreenElement){
    (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
  }
}
document.addEventListener("fullscreenchange", ()=>{
  document.body.classList.toggle("fs", !!document.fullscreenElement);
});

document.addEventListener("keydown", (e)=>{
  switch(e.key){
    case " ": case "Spacebar": e.preventDefault(); togglePause(); break;
    case "ArrowRight": case "ArrowDown": e.preventDefault(); next(); break;
    case "ArrowLeft": case "ArrowUp": e.preventDefault(); prev(); break;
    case "f": case "F": e.preventDefault(); toggleFullscreen(); break;
  }
});

/* ====== START (autoplay bez interakcji) ====== */
show(0);
</script>
</body>
</html>
