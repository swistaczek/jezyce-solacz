<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
.stage{position:relative;width:1080px;height:1920px;display:flex;flex-direction:column;justify-content:flex-end;font-family:"IBM Plex Sans",sans-serif}
.fade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(15,17,21,.85) 100%)}
.top{position:absolute;top:64px;left:64px;display:flex;align-items:center;gap:16px;font-weight:600;font-size:30px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.dot{width:24px;height:24px;border-radius:50%;background:#d8362a;box-shadow:0 0 0 8px rgba(216,54,42,.30)}
.body{position:relative;padding:0 70px 230px}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:104px;line-height:.96;letter-spacing:-.02em;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.6);max-width:13ch}
h1.red{color:#ff6b5e}
.dom{margin-top:26px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:62px;color:#fff;letter-spacing:-.01em}
.dom span{color:#ff6b5e}
.ai{position:absolute;bottom:56px;right:64px;font-size:20px;font-weight:500;letter-spacing:.04em;color:#fff;opacity:.6;text-transform:uppercase;text-shadow:0 2px 10px rgba(0,0,0,.6)}</style></head><body><div class="stage"><div class="fade"></div><div class="top"><span class="dot"></span><span>Jeżyce ↔ Sołacz</span></div><div class="body"><h1 class="red">Wciąż go nie ma.</h1></div><div class="ai">wizualizacja AI</div></div></body></html>
