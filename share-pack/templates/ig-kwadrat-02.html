<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
.card{position:relative;width:1080px;height:1080px;font-family:"IBM Plex Sans",sans-serif;color:#15171b;background:#f3efe6;display:flex;flex-direction:column}
.top{padding:64px 64px 0;display:flex;align-items:center;gap:16px;font-weight:600;font-size:28px;color:#15171b}
.dot{width:22px;height:22px;border-radius:50%;background:#d8362a;box-shadow:0 0 0 7px rgba(216,54,42,.18)}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 64px}
.kicker{font-weight:600;font-size:24px;letter-spacing:.13em;text-transform:uppercase;color:#a82318;margin-bottom:30px}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:132px;line-height:.92;letter-spacing:-.03em}
h1 .red{color:#d8362a}
h1 .line2{display:block;margin-top:18px}
.sub{margin-top:40px;font-size:36px;font-weight:500;color:#3a3d44;max-width:24ch;line-height:1.3}
.sub b{color:#15171b;font-weight:600}
.foot{padding:0 64px 64px;display:flex;align-items:center;justify-content:space-between}
.dom{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:40px;color:#15171b;letter-spacing:-.01em}
.tag{font-size:24px;font-weight:600;color:#d8362a}
.bar{height:14px;background:#d8362a}
</style>
</head>
<body>
<div class="card">
  <div class="top"><span class="dot"></span><span>Jeżyce ↔ Sołacz · inicjatywa obywatelska</span></div>
  <div class="mid">
    <span class="kicker">Przejście pod torami · ul. św. Wawrzyńca</span>
    <h1>W planie <span class="red">od 2024.</span><span class="line2">Wciąż go nie ma.</span></h1>
    <p class="sub">Bezpieczne przejście pieszo-rowerowe pod torami linii 351. <b>Czas je w końcu zbudować.</b></p>
  </div>
  <div class="foot"><span class="dom">jezyce-solacz.pl</span><span class="tag">Poprzyj inicjatywę</span></div>
  <div class="bar"></div>
</div>
</body>
</html>
