<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
.card{position:relative;width:1080px;height:1080px;font-family:"IBM Plex Sans",sans-serif;color:#fff;isolation:isolate;display:flex;flex-direction:column;justify-content:flex-end}
.bg{position:absolute;inset:0;z-index:-2;background:#1b1f25 url("../../hero/hero-07.webp") center 44%/cover no-repeat}
.veil{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(15,17,21,.20) 0%,rgba(15,17,21,.02) 30%,rgba(15,17,21,.50) 60%,rgba(15,17,21,.96) 100%)}
.top{position:absolute;top:56px;left:64px;display:flex;align-items:center;gap:16px;font-weight:600;font-size:28px}
.dot{width:22px;height:22px;border-radius:50%;background:#d8362a;box-shadow:0 0 0 7px rgba(216,54,42,.30)}
.ai{position:absolute;top:64px;right:64px;font-size:18px;font-weight:500;letter-spacing:.04em;opacity:.7;text-transform:uppercase}
.body{padding:0 64px 72px;text-align:center;align-items:center;display:flex;flex-direction:column}
.kicker{display:inline-block;background:#d8362a;font-weight:600;font-size:22px;letter-spacing:.13em;text-transform:uppercase;padding:11px 22px;border-radius:2px;margin-bottom:30px}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:104px;line-height:.94;letter-spacing:-.025em;text-shadow:0 3px 30px rgba(0,0,0,.5)}
.sub{margin-top:26px;font-size:32px;font-weight:500;color:#f1ece2;max-width:26ch;line-height:1.32}
.cta{margin-top:46px;display:inline-block;background:#fff;color:#15171b;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:48px;letter-spacing:-.01em;padding:20px 44px;border-radius:6px}
.note{margin-top:24px;font-size:24px;font-weight:600;color:#ffd9d4;letter-spacing:.02em}
</style>
</head>
<body>
<div class="card">
  <div class="bg"></div>
  <div class="veil"></div>
  <div class="top"><span class="dot"></span><span>Jeżyce ↔ Sołacz</span></div>
  <div class="ai">wizualizacja AI</div>
  <div class="body">
    <span class="kicker">To zajmuje 30 sekund</span>
    <h1>Poprzyj<br>przejście</h1>
    <p class="sub">Podpisz poparcie dla bezpiecznego przejścia pod torami.</p>
    <span class="cta">jezyce-solacz.pl</span>
    <span class="note">Wejdź na stronę i poprzyj</span>
  </div>
</div>
</body>
</html>
