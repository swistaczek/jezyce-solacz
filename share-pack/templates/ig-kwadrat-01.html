<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
.card{position:relative;width:1080px;height:1080px;font-family:"IBM Plex Sans",sans-serif;color:#fff;isolation:isolate;display:flex;flex-direction:column;justify-content:flex-end}
.bg{position:absolute;inset:0;z-index:-2;background:#1b1f25 url("../../hero/hero-09.webp") center 42%/cover no-repeat}
.veil{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(15,17,21,.28) 0%,rgba(15,17,21,.04) 34%,rgba(15,17,21,.58) 66%,rgba(15,17,21,.95) 100%)}
.top{position:absolute;top:56px;left:64px;display:flex;align-items:center;gap:16px;font-weight:600;font-size:28px;letter-spacing:.01em}
.dot{width:22px;height:22px;border-radius:50%;background:#d8362a;box-shadow:0 0 0 7px rgba(216,54,42,.30)}
.ai{position:absolute;top:64px;right:64px;font-size:18px;font-weight:500;letter-spacing:.04em;opacity:.7;text-transform:uppercase}
.body{padding:0 64px 70px}
.kicker{display:inline-block;background:#d8362a;font-weight:600;font-size:22px;letter-spacing:.13em;text-transform:uppercase;padding:11px 20px;border-radius:2px;margin-bottom:28px}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:118px;line-height:.93;letter-spacing:-.025em;text-shadow:0 3px 30px rgba(0,0,0,.45);max-width:13ch}
h1 em{font-style:normal;color:#ffd9d4;text-decoration:underline;text-decoration-color:#d8362a;text-underline-offset:11px;text-decoration-thickness:9px}
.footrow{margin-top:46px;display:flex;align-items:center;gap:22px;font-size:34px;font-weight:600}
.pill{background:#fff;color:#15171b;padding:15px 28px;border-radius:4px}
.dom{opacity:.95;letter-spacing:.02em}
</style>
</head>
<body>
<div class="card">
  <div class="bg"></div>
  <div class="veil"></div>
  <div class="top"><span class="dot"></span><span>Inicjatywa obywatelska</span></div>
  <div class="ai">wizualizacja AI</div>
  <div class="body">
    <span class="kicker">Przejście pod torami · ul. św. Wawrzyńca</span>
    <h1>Połączmy Jeżyce z <em>Sołaczem</em></h1>
    <div class="footrow"><span class="pill">Poprzyj</span><span class="dom">jezyce-solacz.pl</span></div>
  </div>
</div>
</body>
</html>
