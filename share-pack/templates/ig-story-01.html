<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
.card{position:relative;width:1080px;height:1920px;font-family:"IBM Plex Sans",sans-serif;color:#fff;isolation:isolate;display:flex;flex-direction:column;justify-content:flex-end}
.bg{position:absolute;inset:0;z-index:-2;background:#1b1f25 url("../../hero/hero-01.webp") center 38%/cover no-repeat}
.veil{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(15,17,21,.55) 0%,rgba(15,17,21,.10) 26%,rgba(15,17,21,.10) 50%,rgba(15,17,21,.62) 74%,rgba(15,17,21,.97) 100%)}
/* strefa naklejki link u góry */
.sticker{position:absolute;top:150px;left:0;right:0;text-align:center}
.sticker .hint{display:inline-block;border:2px dashed rgba(255,255,255,.55);border-radius:14px;padding:16px 30px;font-size:26px;font-weight:600;color:#fff;letter-spacing:.02em}
.top{position:absolute;top:64px;left:64px;display:flex;align-items:center;gap:16px;font-weight:600;font-size:30px}
.dot{width:24px;height:24px;border-radius:50%;background:#d8362a;box-shadow:0 0 0 8px rgba(216,54,42,.30)}
.ai{position:absolute;bottom:60px;right:64px;font-size:20px;font-weight:500;letter-spacing:.04em;opacity:.65;text-transform:uppercase}
.body{padding:0 70px 200px}
.kicker{display:inline-block;background:#d8362a;font-weight:600;font-size:26px;letter-spacing:.12em;text-transform:uppercase;padding:13px 24px;border-radius:2px;margin-bottom:34px}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:140px;line-height:.92;letter-spacing:-.028em;text-shadow:0 4px 34px rgba(0,0,0,.5);max-width:12ch}
h1 em{font-style:normal;color:#ffd9d4;text-decoration:underline;text-decoration-color:#d8362a;text-underline-offset:13px;text-decoration-thickness:11px}
.sub{margin-top:34px;font-size:38px;font-weight:500;color:#f1ece2;max-width:24ch;line-height:1.3}
.sub b{color:#fff;font-weight:600}
.dom{margin-top:48px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:58px;color:#fff;letter-spacing:-.01em}
</style>
</head>
<body>
<div class="card">
  <div class="bg"></div>
  <div class="veil"></div>
  <div class="top"><span class="dot"></span><span>Jeżyce ↔ Sołacz</span></div>
  <div class="sticker"><span class="hint">↑ naklejka „Link" tutaj</span></div>
  <div class="body">
    <span class="kicker">Przejście pod torami · św. Wawrzyńca</span>
    <h1>Połączmy Jeżyce z <em>Sołaczem</em></h1>
    <p class="sub">Bezpieczne przejście pieszo-rowerowe pod torami. <b>W planie od 2024 — wciąż go nie ma.</b></p>
    <div class="dom">jezyce-solacz.pl</div>
  </div>
  <div class="ai">wizualizacja AI</div>
</div>
</body>
</html>
