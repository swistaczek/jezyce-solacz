<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<!-- Karta cytatu — KWADRAT 1080x1080. PNG z przezroczystym tlem.
     Render: Chrome --default-background-color=00000000 + body{background:transparent}.
     Plyta karty jest NIEPRZEZROCZYSTA (papier), margines wokol PRZEZROCZYSTY -> czytelne
     na jasnym i ciemnym tle hosta; dyskretny cien "odkleja" karte od tla. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15171b;--paper:#f3efe6;--paper-2:#e8e2d4;
  --signal:#d8362a;--signal-deep:#a82318;--muted:#5d6068;--line:rgba(21,23,27,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
body{background:transparent;font-family:"IBM Plex Sans",system-ui,sans-serif;
  /* margines przezroczysty wokol plyty (na cien) */
  display:flex;align-items:center;justify-content:center;padding:46px}
.card{
  position:relative;width:100%;height:100%;
  background:var(--paper);color:var(--ink);border-radius:22px;
  border:1px solid var(--line);
  box-shadow:0 30px 70px -28px rgba(21,23,27,.55), 0 4px 14px -8px rgba(21,23,27,.30);
  padding:96px 84px 78px;display:flex;flex-direction:column;isolation:isolate;overflow:hidden}
/* czerwony pasek-akcent u gory (sygnatura systemu) */
.card::after{content:"";position:absolute;left:0;top:0;width:100%;height:10px;background:var(--signal)}
/* duzy cudzyslow-ozdobnik */
.mark{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;color:var(--signal);
  font-size:200px;line-height:.6;height:84px;margin-bottom:14px;user-select:none}
/* CYTAT — auto-skalowanie przez klasy dlugosci na .card: len-s / len-m / len-l / len-xl */
.q{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;letter-spacing:-.015em;
  color:var(--ink);flex:1 1 auto;display:flex;align-items:center}
.card.len-s  .q{font-size:78px;line-height:1.04}
.card.len-m  .q{font-size:64px;line-height:1.08}
.card.len-l  .q{font-size:52px;line-height:1.12}
.card.len-xl .q{font-size:42px;line-height:1.16}
.q b{font-weight:800;color:var(--signal-deep)} /* opcjonalne wyroznienie frazy */
/* STOPKA: podpis (dzielnica) + sygnatura domeny + etykieta inicjatywy */
.foot{margin-top:34px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.by{font-family:"IBM Plex Sans",sans-serif;font-weight:700;font-size:23px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:14px}
.by::before{content:"";width:34px;height:3px;background:var(--signal);display:inline-block;border-radius:2px}
.sig{text-align:right;line-height:1.25}
.sig .init{font-size:16px;font-weight:600;letter-spacing:.05em;color:var(--muted)}
.sig .dom{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;
  letter-spacing:-.01em;color:var(--ink)}
.sig .dom span{color:var(--signal)} /* kropka domeny w czerwieni */
</style>
</head>
<body>
<!-- PODMIEN: klasa dlugosci (len-s|len-m|len-l|len-xl), tresc .q, .by (dzielnica) -->
<div class="card len-m">
  <div class="mark">&#8220;</div>
  <blockquote class="q">Wiadukt to jedyna brama z Jeżyc na Sołacz &mdash; i zarazem wąskie gardło.</blockquote>
  <div class="foot">
    <div class="by">Jeżyce</div>
    <div class="sig">
      <div class="init">Inicjatywa obywatelska · Jeżyce ↔ Sołacz</div>
      <div class="dom">jezyce-solacz<span>.</span>pl</div>
    </div>
  </div>
</div>
</body>
</html>
